name: Publicar sitio

on:
  push:
    branches: ["2026"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      # Python para las páginas que ejecutan código (execute: enabled: true).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar entorno de Python
        run: uv sync --locked

      # uv run pone el .venv en el PATH, y Quarto usa ese Python.
      - name: Renderizar
        run: uv run quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
